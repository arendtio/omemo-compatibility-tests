# Fast feedback loop for MonalWire native interop (skips Siskin build/matrix).
name: Monal wire (macOS)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run (default: alice_sends_bob_replies only)"
        required: false
        default: alice_sends_bob_replies
        type: choice
        options:
          - alice_sends_bob_replies
          - unicode_body_roundtrip
          - all
  push:
    branches: ["cursor/**"]
    paths:
      - "interop/monal-native/**"
      - "interop/clients/**"
      - "interop/android/conv-native/**"
      - "scripts/run-monal-wire.sh"
      - "scripts/build-monal-native.sh"
      - "scripts/run-interop-matrix.py"
      - "lib/omemo_interop/monal_native_wire.py"
      - "docker/ejabberd/**"
      - ".github/workflows/monal-wire-macos.yml"

jobs:
  monal-wire:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install suite
        run: pip install -e ".[dev]"

      - name: Download vendors (Monal + Conversations)
        run: >
          python3 scripts/download-implementations.py --skip-optional
          --ref monal=c69bd05ac245f8ba1e206e4185a3ca92607ecaa8
          --only conversations --only monal

      - name: Install Rust nightly (Monal rust bridge)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Build Monal native wire
        run: ./scripts/build-monal-native.sh

      - name: Build Conversations native wire (Alice)
        run: ./scripts/build-conversations-native.sh

      - name: Install ejabberd
        run: brew install ejabberd

      - name: Start ejabberd
        run: ./scripts/start-ejabberd-interop.sh
        env:
          OMEMO_XMPP_SECURITY: disabled

      - name: Monal wire matrix
        run: |
          SCENARIO="${{ github.event.inputs.scenario || 'all' }}"
          ARGS=(--pair conversations-native-vs-monal --native-conversations)
          if [ "$SCENARIO" != "all" ]; then
            ARGS+=(--scenario "$SCENARIO")
          fi
          python3 scripts/run-interop-matrix.py "${ARGS[@]}"
        env:
          OMEMO_XMPP_SECURITY: disabled
          OMEMO_NATIVE_MACOS: "1"
          MONAL_WIRE_AWAIT_TIMEOUT: "600"
          CONVERSATIONS_WIRE_AWAIT_TIMEOUT: "600"

      - name: Stop ejabberd
        if: always()
        run: ./scripts/stop-ejabberd-interop.sh

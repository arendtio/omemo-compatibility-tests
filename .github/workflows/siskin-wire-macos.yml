# Fast feedback loop for Siskin native wire interop.
name: Siskin wire (macOS)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run (default: all pair scenarios)"
        required: false
        default: all
        type: choice
        options:
          - alice_sends_bob_replies
          - bob_sends_alice_replies
          - unicode_body_roundtrip
          - repeated_session_messages
          - all
  push:
    branches: [main, "cursor/**"]
    paths:
      - "interop/siskin-native/**"
      - "interop/android/conv-native/**"
      - "scripts/build-siskin-native.sh"
      - "scripts/run-interop-matrix.py"
      - "lib/omemo_interop/siskin_native_wire.py"
      - "docker/ejabberd/**"
      - ".github/workflows/siskin-wire-macos.yml"

jobs:
  siskin-wire:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install suite
        run: pip install -e ".[dev]"

      - name: Download vendors (Siskin + Conversations)
        run: >
          python3 scripts/download-implementations.py --skip-optional
          --ref martin_omemo=2e8435ec48dfb2a70ba414252cc1c8a3815bf24e
          --only conversations

      - name: Build Siskin native wire
        run: ./scripts/build-siskin-native.sh

      - name: Siskin MartinOMEMO crypto tests
        run: cd interop/siskin-native && swift test

      - name: Build Conversations native wire (Alice)
        run: ./scripts/build-conversations-native.sh

      - name: Install ejabberd
        run: brew install ejabberd

      - name: Start ejabberd
        run: ./scripts/start-ejabberd-interop.sh
        env:
          OMEMO_XMPP_SECURITY: disabled

      - name: Siskin wire matrix
        run: |
          SCENARIO="${{ github.event.inputs.scenario || 'all' }}"
          ARGS=(--pair conversations-native-vs-siskin --native-conversations)
          if [ "$SCENARIO" != "all" ]; then
            ARGS+=(--scenario "$SCENARIO")
          fi
          python3 scripts/run-interop-matrix.py "${ARGS[@]}"
        env:
          OMEMO_XMPP_SECURITY: disabled
          OMEMO_NATIVE_MACOS: "1"
          SISKIN_WIRE_AWAIT_TIMEOUT: "600"
          CONVERSATIONS_WIRE_AWAIT_TIMEOUT: "600"

      - name: Stop ejabberd
        if: always()
        run: ./scripts/stop-ejabberd-interop.sh

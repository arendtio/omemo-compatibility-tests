name: OMEMO Interop CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install suite
        run: pip install -e ".[dev]"

      - name: Download implementations
        run: python3 scripts/download-implementations.py --skip-optional

      - name: Upstream unit tests
        run: python3 scripts/run-upstream-tests.py

pytest tests/ -v -m "not wire"

  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install suite
        run: pip install -e ".[dev]"

      - name: Start ejabberd
        run: docker compose -f docker/ejabberd/docker-compose.yml up -d --wait

      - name: Wire tests
        run: python3 -m pytest tests/ -v -m wire

      - name: Stop ejabberd
        if: always()
        run: docker compose -f docker/ejabberd/docker-compose.yml down

name: OMEMO Interop CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install suite
        run: pip install -e ".[dev]"

      - name: Download implementations
        run: python3 scripts/download-implementations.py --skip-optional

      - name: Upstream unit tests
        run: python3 scripts/run-upstream-tests.py

      - name: Build wire clients
        run: ./scripts/build-clients.sh

      - name: Legacy interoperability tests
        run: python3 -m pytest tests/ -v -m "not wire and not omemo2"

  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install suite
        run: pip install -e ".[dev]"

      - name: Download implementations
        run: python3 scripts/download-implementations.py --skip-optional

      - name: Build wire clients
        run: ./scripts/build-clients.sh

      - name: Start ejabberd
        run: docker compose -f docker/ejabberd/docker-compose.yml up -d --wait

      - name: Client interop matrix
        run: python3 scripts/run-interop-matrix.py --pair conversations-vs-monal --build

      - name: Wire pytest suite
        run: python3 -m pytest tests/wire/ -v -m wire

      - name: Stop ejabberd
        if: always()
        run: docker compose -f docker/ejabberd/docker-compose.yml down

name: OMEMO Interop CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install suite
        run: pip install -e ".[dev]"

      - name: Download implementations
        run: >
          python3 scripts/download-implementations.py --skip-optional
          --ref martin_omemo=2e8435ec48dfb2a70ba414252cc1c8a3815bf24e
          --ref monal=c69bd05ac245f8ba1e206e4185a3ca92607ecaa8

      - name: Upstream unit tests
        run: python3 scripts/run-upstream-tests.py

      - name: Build wire clients
        run: ./scripts/build-clients.sh

      - name: Legacy interoperability tests
        run: python3 -m pytest tests/ -v -m "not wire and not omemo2"

  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install suite
        run: pip install -e ".[dev]"

      - name: Download implementations
        run: >
          python3 scripts/download-implementations.py --skip-optional
          --ref martin_omemo=2e8435ec48dfb2a70ba414252cc1c8a3815bf24e
          --ref monal=c69bd05ac245f8ba1e206e4185a3ca92607ecaa8

      - name: Build wire clients
        run: ./scripts/build-clients.sh

      - name: Start ejabberd
        run: docker compose -f docker/ejabberd/docker-compose.yml up -d --wait

      - name: Client interop matrix (Siskin)
        run: python3 scripts/run-interop-matrix.py --pair conversations-vs-siskin --build
        env:
          OMEMO_XMPP_SECURITY: disabled

      - name: Client interop matrix (Monal)
        run: python3 scripts/run-interop-matrix.py --pair conversations-vs-monal --build
        env:
          OMEMO_XMPP_SECURITY: disabled

      - name: Wire pytest suite
        run: python3 -m pytest tests/wire/ tests/compatibility/ -v -m wire
        env:
          OMEMO_XMPP_SECURITY: disabled

      - name: Stop ejabberd
        if: always()
        run: docker compose -f docker/ejabberd/docker-compose.yml down

  native-conversations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install suite
        run: pip install -e ".[dev]"

      - name: Download Conversations vendor
        run: python3 scripts/download-implementations.py --only conversations

      - name: Conversations vendor axolotl native proof
        run: ./scripts/build-conversations-native.sh

      - name: Native pytest (Conversations)
        run: python3 -m pytest tests/native/test_conversations_native_crypto.py -v -m native

      - name: Vendor XML contract unit test
        run: cd interop/android && ./gradlew :conv-native:testDebugUnitTest --tests "eu.siacs.conversations.crypto.axolotl.ConversationsVendorXmlContractTest" --no-daemon -q

      - name: Build Smack wire peers (Siskin + Monal)
        run: ./scripts/build-clients.sh

      - name: Start ejabberd
        run: docker compose -f docker/ejabberd/docker-compose.yml up -d --wait

      - name: Native Conversations vs Siskin wire matrix
        run: python3 scripts/run-interop-matrix.py --pair conversations-native-vs-siskin --native-conversations
        env:
          OMEMO_XMPP_SECURITY: disabled

      - name: Native Conversations vs Monal wire matrix
        run: python3 scripts/run-interop-matrix.py --pair conversations-native-vs-monal --native-conversations
        env:
          OMEMO_XMPP_SECURITY: disabled

      - name: Native cross-wire pytest
        run: python3 -m pytest tests/wire/test_conversations_native_cross_wire.py -v -m native
        env:
          OMEMO_XMPP_SECURITY: disabled

      - name: Stop ejabberd
        if: always()
        run: docker compose -f docker/ejabberd/docker-compose.yml down

  server-matrix-prosody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install suite
        run: pip install -e ".[dev]"

      - name: Download slixmpp vendor
        run: python3 scripts/download-implementations.py --only slixmpp-omemo

      - name: Start Prosody
        run: docker compose -f docker/prosody/docker-compose.yml up -d --wait

      - name: Prosody server-matrix roundtrip
        run: python3 scripts/run-server-matrix.py --profile prosody
        env:
          OMEMO_XMPP_SECURITY: disabled

      - name: Stop Prosody
        if: always()
        run: docker compose -f docker/prosody/docker-compose.yml down

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install suite
        run: pip install -e ".[dev]"

      - name: Download vendors
        run: >
          python3 scripts/download-implementations.py --skip-optional
          --ref martin_omemo=2e8435ec48dfb2a70ba414252cc1c8a3815bf24e
          --ref monal=c69bd05ac245f8ba1e206e4185a3ca92607ecaa8

      - name: Build Siskin native wire
        run: ./scripts/build-siskin-native.sh

      - name: Siskin MartinOMEMO crypto tests
        run: cd interop/siskin-native && swift test

      - name: Build Monal native wire (MonalWire CLI)
        run: ./scripts/build-monal-native.sh

      - name: Conversations native proof
        run: ./scripts/build-conversations-native.sh

      - name: Setup Docker (Colima)
        run: |
          brew install colima docker docker-compose
          colima start --cpu 2 --memory 4

      - name: Start ejabberd
        run: docker compose -f docker/ejabberd/docker-compose.yml up -d --wait

      - name: Native Conversations vs Siskin MartinOMEMO matrix
        run: python3 scripts/run-interop-matrix.py --pair conversations-native-vs-siskin --native-conversations
        env:
          OMEMO_XMPP_SECURITY: disabled
          OMEMO_NATIVE_MACOS: "1"

      - name: Native Conversations vs Monal MLOMEMO matrix
        run: python3 scripts/run-interop-matrix.py --pair conversations-native-vs-monal --native-conversations
        env:
          OMEMO_XMPP_SECURITY: disabled
          OMEMO_NATIVE_MACOS: "1"

      - name: Stop ejabberd
        if: always()
        run: |
          docker compose -f docker/ejabberd/docker-compose.yml down || true
          colima stop || true

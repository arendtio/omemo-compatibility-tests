services:
  prosody:
    image: prosodyim/prosody:13.0
    container_name: omemo-interop-prosody
    ports:
      - "5222:5222"
    volumes:
      - ./prosody.cfg.lua:/etc/prosody/conf.d/interop.cfg.lua:ro
      - prosody_data:/var/lib/prosody
    environment:
      PROSODY_VIRTUAL_HOSTS: localhost
      PROSODY_LOGLEVEL: info

volumes:
  prosody_data:

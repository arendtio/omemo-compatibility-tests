# Legacy OMEMO (eu.siacs.conversations.axolotl) interoperability matrix.
# OMEMO 2.0 (urn:xmpp:omemo:2) is intentionally excluded until implementations stabilize.

namespace: eu.siacs.conversations.axolotl
namespace_uri: "eu.siacs.conversations.axolotl"

# Wire interop pairs — each side uses code from the checked-out vendor tree.
pairs:
  - id: conversations-vs-siskin
    description: "DEPRECATED Smack proxy both sides — use native pairs on macOS"
    left: conversations
    right: siskin_im
    deprecated_smack_proxy: true
    scenarios:
      - alice_sends_bob_replies
      - bob_sends_alice_replies
      - unicode_body_roundtrip
      - repeated_session_messages

  - id: conversations-vs-monal
    description: "DEPRECATED Smack proxy both sides — use native pairs on macOS"
    left: conversations
    right: monal
    deprecated_smack_proxy: true
    scenarios:
      - alice_sends_bob_replies
      - bob_sends_alice_replies
      - unicode_body_roundtrip
      - repeated_session_messages

  - id: conversations-native-vs-siskin
    description: Conversations vendor AxolotlService vs Siskin MartinOMEMO (macOS native right)
    left: conversations
    right: siskin_im
    native_left: true
    native_right: true
    scenarios:
      - alice_sends_bob_replies
      - bob_sends_alice_replies
      - unicode_body_roundtrip
      - repeated_session_messages

  - id: conversations-native-vs-monal
    description: Conversations vendor AxolotlService vs Monal MLOMEMO (macOS native right)
    left: conversations
    right: monal
    native_left: true
    native_right: true
    scenarios:
      - alice_sends_bob_replies
      - bob_sends_alice_replies
      - unicode_body_roundtrip
      - repeated_session_messages

  - id: conversations-native-vs-siskin-smack
    description: "DEPRECATED: Conversations native vs Siskin Smack proxy (use conversations-native-vs-siskin on macOS)"
    left: conversations
    right: siskin_im
    native_left: true
    scenarios:
      - alice_sends_bob_replies
      - unicode_body_roundtrip

  - id: conversations-native-vs-monal-smack
    description: "DEPRECATED: Conversations native vs Monal Smack proxy"
    left: conversations
    right: monal
    native_left: true
    scenarios:
      - alice_sends_bob_replies
      - unicode_body_roundtrip

  - id: conversations-vs-conversations
    description: Sanity check — two sessions using Conversations implementation
    left: conversations
    right: conversations
    scenarios:
      - cross_session_roundtrip

  - id: monal-vs-monal
    description: Sanity check — two sessions using Monal implementation
    left: monal
    right: monal
    scenarios:
      - cross_session_roundtrip

# Client runner definitions (see interop/clients/)
clients:
  conversations:
    vendor_id: conversations
    implementation: conversations
    gradle_module: conversations
    runner: interop/clients/conversations
    main_class: org.omemo.interop.conversations.ConversationsWireClient
    platform: [linux, macos]
    notes: >
      Compiles against vendor/conversations via Gradle; uses Conversations axolotl
      wire format (signal-protocol-java 2.6.2). Requires JDK 17+.

  monal:
    vendor_id: monal
    implementation: monal
    gradle_module: monal
    runner: interop/clients/monal
    main_class: org.omemo.interop.monal.MonalWireClient
    platform: [linux, macos]
    notes: >
      macOS: interop/monal-native (MLOMEMO + monalxmpp). Linux: deprecated Smack proxy
      in interop/clients/monal — set OMEMO_FORCE_SMACK_PROXY=1 to force.

  siskin_im:
    vendor_id: siskin_im
    implementation: siskin_im
    gradle_module: siskin
    runner: interop/clients/siskin
    main_class: org.omemo.interop.siskin.SiskinWireClient
    platform: [linux, macos]
    native_wire: interop/siskin-native
    notes: >
      macOS: Martin + MartinOMEMO via interop/siskin-native. Smack Gradle proxy is
      deprecated (OMEMO_FORCE_SMACK_PROXY=1). Linux CI keeps Smack until removed.

  slixmpp-oldmemo:
    vendor_id: slixmpp-omemo
    implementation: slixmpp-oldmemo
    runner: python
    platform: [linux, macos]
    notes: Reference Python client (oldmemo only) for protocol debugging.

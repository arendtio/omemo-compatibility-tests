# Conversations vs Siskin — compatibility audit registry
# Methodology: requirements/technical/02-omemo-audit-methodology.md
# Pins: config/audit-source-pins.yaml

methodology: control_flow_and_wire_format

# Wire format: clients agree on legacy axolotl XML/crypto.
wire_format:
  aligned: true
  namespace: eu.siacs.conversations.axolotl
  note: >
    Same PEP nodes, AES-128-GCM, 12-byte IV, 16-byte key + 16-byte tag in ratchet envelope.
    Real decrypt failures are usually partial send or stale PEP, not codec mismatch.

findings:
  - id: partial_send_conversations
    severity: P0
    aligned: false
    category: control_flow
    title: Conversations may omit keys without failing send
    symptom: '"Provides keys: []" or missing device on receive'
    source_paths:
      - vendor/conversations/src/main/java/eu/siacs/conversations/crypto/axolotl/AxolotlService.java
      - vendor/conversations/src/main/java/eu/siacs/conversations/crypto/axolotl/XmppAxolotlMessage.java
    pattern: "addDevice() ignores null from processSending(); buildHeader() returns true"
    minimal_fix: "Collect expected remote devices; fail send if any addDevice fails"
    linked_issues:
      - https://github.com/tigase/siskin-im/issues/162
    tests:
      - tests/compatibility/test_source_control_flow_audit.py::test_conversations_partial_send_must_not_silently_skip_null_keys
      - tests/compatibility/test_audit_regression_fixtures.py::test_partial_coverage_message_rejected_by_harness
      - tests/compatibility/test_vendor_open_bugs.py::test_partial_send_conversations_violates_expected_subset_encoded

  - id: partial_send_siskin
    severity: P0
    aligned: false
    category: control_flow
    title: MartinOMEMO drops failed session ciphers from header
    symptom: Message encrypts for subset of devices; peers cannot decrypt
    source_paths:
      - vendor/MartinOMEMO/Sources/MartinOMEMO/OMEMOModule.swift
    pattern: "_encrypt compactMap returns nil on encrypt catch; addresses() try? swallows PEP failure"
    minimal_fix: "Throw on encrypt failure; propagate PEP errors; verify expected ⊆ encoded"
    linked_issues:
      - https://github.com/tigase/siskin-im/issues/162
    tests:
      - tests/compatibility/test_source_control_flow_audit.py::test_siskin_partial_send_must_not_drop_failed_encrypts
      - tests/compatibility/test_source_control_flow_audit.py::test_siskin_pep_failure_must_not_swallow_into_empty_addresses
      - tests/compatibility/test_vendor_open_bugs.py::test_partial_send_siskin_violates_expected_subset_encoded
      - tests/compatibility/test_vendor_open_bugs.py::test_siskin_pep_failure_must_not_yield_empty_send_set

  - id: siskin_bundle_before_announce
    severity: P1
    aligned: false
    category: control_flow
    title: Device may be announced when bundle publish path treats errors as success
    source_paths:
      - vendor/MartinOMEMO/Sources/MartinOMEMO/OMEMOModule.swift
    pattern: "publishDeviceBundleIfNeeded catches XMPPError; non-item_not_found/internal_server_error returns without throw"
    minimal_fix: "Propagate XMPP errors; reconfigure bundle node on precondition-not-met"
    tests:
      - tests/compatibility/test_source_control_flow_audit.py::test_siskin_bundle_publish_must_propagate_xmpp_errors
      - tests/compatibility/test_vendor_open_bugs.py::test_siskin_bundle_publish_must_not_swallow_non_item_not_found

  - id: siskin_trust_callback_always_true
    severity: P1
    category: security
    title: libsignal isTrusted always returns true
    aligned: false
    source_paths:
      - vendor/siskin_im/SiskinIM/database/DBOMEMOStore.swift
    pattern: "isTrusted returns true unconditionally"
    minimal_fix: "Map DB identity status; reject compromised / key-change"
    tests:
      - tests/compatibility/test_source_control_flow_audit.py::test_siskin_istrusted_must_not_always_return_true
      - tests/compatibility/test_conversations_siskin_protocol.py::test_trust_model_siskin_must_not_ignore_compromised_identities
      - tests/compatibility/test_vendor_open_bugs.py::test_siskin_istrusted_always_true_allows_compromised_send

  - id: auth_tag_in_ratchet_key
    severity: info
    category: wire_format
    aligned: true
    tests:
      - tests/compatibility/test_conversations_siskin_protocol.py::test_auth_tag_in_key_roundtrip

  - id: prekey_attribute_variants
    severity: info
    category: wire_format
    aligned: true
    note: "Receivers accept true/1; false/0/missing mean SignalMessage path"
    tests:
      - tests/compatibility/test_audit_regression_fixtures.py::test_prekey_attribute_variants_on_parse

  - id: muc_same_rid_multiple_keys
    severity: P1
    category: control_flow
    aligned: true
    note: "Conversations and MartinOMEMO try all keys with matching rid; Monal uses findFirst (see monal_same_rid_findfirst)"
    tests:
      - tests/compatibility/test_audit_regression_fixtures.py::test_multiple_keys_same_rid_collects_candidates
      - tests/compatibility/test_monal_control_flow_audit.py::test_monal_decrypt_must_not_use_findfirst_for_rid_only

  - id: partial_send_monal
    severity: P0
    aligned: false
    category: control_flow
    title: Monal continues on per-device encrypt failure
    symptom: Message envelope returned even when some device keys fail
    source_paths:
      - vendor/monal/Monal/Classes/MLOMEMO.m
    pattern: "addEncryptionKeyForAllDevices continues on error; encryptString still returns envelope"
    minimal_fix: "Fail send when expected remote devices lack keys in header"
    linked_issues:
      - https://github.com/monal-im/Monal/issues/240
    tests:
      - tests/compatibility/test_monal_control_flow_audit.py::test_monal_partial_send_must_not_continue_on_encrypt_error
      - tests/compatibility/test_vendor_open_bugs.py::test_partial_send_monal_violates_expected_subset_encoded

  - id: monal_self_device_filter_not_jid_scoped
    severity: P1
    aligned: false
    category: control_flow
    title: Monal skips own device by id only, not JID
    symptom: Foreign JID with same device id incorrectly skipped in trust check
    source_paths:
      - vendor/monal/Monal/Classes/MLOMEMO.m
    pattern: "checkTrustOfAllDevices compares device.unsignedIntValue to local deviceid only"
    minimal_fix: "Compare full SignalAddress (jid + device id)"
    linked_issues:
      - https://github.com/monal-im/Monal/issues/240
    tests:
      - tests/compatibility/test_monal_control_flow_audit.py::test_monal_self_device_filter_must_be_jid_scoped

  - id: monal_same_rid_findfirst
    severity: P1
    aligned: false
    category: control_flow
    title: Monal decrypt picks first matching rid key only
    symptom: MUC duplicate rid may decrypt wrong key or fail
    source_paths:
      - vendor/monal/Monal/Classes/MLOMEMO.m
    pattern: "findFirst on header/key with rid attribute"
    minimal_fix: "Try all keys with matching rid like Conversations/MartinOMEMO"
    tests:
      - tests/compatibility/test_monal_control_flow_audit.py::test_monal_decrypt_must_not_use_findfirst_for_rid_only
      - tests/compatibility/test_vendor_open_bugs.py::test_monal_findfirst_rid_must_try_all_matching_keys

  - id: monal_devicelist_fetch_fakes_empty
    severity: P2
    aligned: false
    category: control_flow
    title: Monal fakes empty devicelist on own fetch error
    source_paths:
      - vendor/monal/Monal/Classes/MLOMEMO.m
    pattern: "handleOwnDevicelistFetchError fakes empty devicelist"
    minimal_fix: "Surface fetch failure; do not treat as zero devices"
    tests:
      - tests/compatibility/test_monal_control_flow_audit.py::test_monal_devicelist_fetch_error_must_not_fake_empty_list
      - tests/compatibility/test_vendor_open_bugs.py::test_monal_devicelist_fetch_error_must_not_fake_empty_list

  - id: monal_carbon_mam_dedup_signal_error_3
    severity: P2
    aligned: false
    category: control_flow
    title: Monal treats Signal error code 3 as dedup without session repair
    source_paths:
      - vendor/monal/Monal/Classes/MLOMEMO.m
    pattern: "error.code == 3 Deduplicated log path"
    minimal_fix: "Distinguish true duplicates from stale-session duplicates"
    tests:
      - tests/compatibility/test_monal_control_flow_audit.py::test_monal_duplicate_message_must_repair_session_on_signal_error_3
      - tests/compatibility/test_vendor_open_bugs.py::test_monal_carbon_duplicate_must_repair_session_not_only_dedup

  - id: monal_trust_gating_on_send
    severity: info
    category: security
    aligned: true
    note: "Monal filters untrusted devices via acceptedTrustLevel before send (unlike Siskin isTrusted always true)"
    source_paths:
      - vendor/monal/Monal/Classes/MLOMEMO.m
      - vendor/monal/Monal/Classes/MLSignalStore.m
    tests:
      - tests/compatibility/test_monal_control_flow_audit.py::test_monal_trust_gating_on_send

  - id: pep_open_access
    severity: P2
    category: operational
    aligned: true
    mitigated_by: docker/ejabberd/ejabberd.yml
    tests:
      - tests/compatibility/test_conversations_siskin_wire.py::test_wire_cross_fetch_without_prior_roster

regression_matrix:
  # From Kompatibilitätsaudit § Kleine gemeinsame Regressionstest-Suite
  - id: prekey_variants
    covered: true
  - id: bundle_not_ready_no_partial_send
    covered: true
    note: harness rejects via NoEligibleDevices when bundle missing
  - id: one_cipher_fails_no_wire_message
    covered: partial
    note: harness partial-coverage decrypt fail; vendor static audits document send-path gaps
  - id: foreign_jid_same_device_id
    covered: true
    note: harness multi-recipient same device id; Monal static audit for JID-scoping bug
  - id: muc_duplicate_rid
    covered: true
  - id: pep_precondition_not_met_retry
    covered: static_only
  - id: device_list_fetch_error_not_empty
    covered: static_only
    note: Monal fakes empty list; MartinOMEMO try? returns []
  - id: compromised_identity_blocked
    covered: true
    note: harness NoEligibleDevices when distrusted; Monal static acceptedTrustLevel
  - id: carbon_mam_duplicate
    covered: partial
    note: carbon duplicate XML fixture + Monal Signal error code 3 static audit

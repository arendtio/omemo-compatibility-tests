# Upstream implementations — legacy OMEMO focus (eu.siacs.conversations.axolotl)

namespace: eu.siacs.conversations.axolotl

implementations:
  - id: python-omemo
    description: Core OMEMO protocol library (backends include oldmemo)
    repo: https://github.com/Syndace/python-omemo.git
    branch: main
    type: library

  - id: python-oldmemo
    description: Legacy OMEMO backend — same namespace as Conversations and Monal
    repo: https://github.com/Syndace/python-oldmemo.git
    branch: main
    type: library

  - id: slixmpp-omemo
    description: Slixmpp OMEMO plugin (reference wire client)
    repo: https://github.com/Syndace/slixmpp-omemo.git
    branch: main
    type: library

  - id: ejabberd
    description: ejabberd XMPP server
    repo: https://github.com/processone/ejabberd.git
    branch: master
    type: server
    clone_only: true

  - id: conversations
    description: Conversations Android client — legacy axolotl OMEMO
    repo: https://codeberg.org/iNPUTmice/Conversations.git
    branch: master
    type: client
    namespace: eu.siacs.conversations.axolotl
    wire_runner: conversations_android_crypto

  - id: gajim
    description: Gajim desktop client — omemo_dr stack
    repo: https://dev.gajim.org/gajim/gajim.git
    branch: main
    type: client
    namespace: eu.siacs.conversations.axolotl
    wire_runner: gajim_omemo_dr

  - id: dino
    description: Dino GTK client
    repo: https://github.com/dino/dino.git
    branch: main
    type: client
    namespace: eu.siacs.conversations.axolotl
    wire_runner: dino_native

  - id: monal
    description: Monal iOS client — legacy axolotl OMEMO (not OMEMO 2)
    repo: https://github.com/monal-im/Monal.git
    branch: main
    type: client
    namespace: eu.siacs.conversations.axolotl
    wire_runner: monal_native

  # OMEMO 2 backends — optional, not used in default interop matrix
  - id: python-twomemo
    description: OMEMO 2 (urn:xmpp:omemo:2) — excluded from default interop
    repo: https://github.com/Syndace/python-twomemo.git
    branch: main
    type: library
    optional: true

upstream_test_commands:
  python-omemo: "pip install -e '.[dev]' -q && python3 -m pytest tests/ -q"
  slixmpp-omemo: "pip install -e '.[test]' -q && python3 -m pytest tests/ -q"

client_build_commands:
  conversations: "cd interop/clients && ./gradlew :conversations:installDist -q"
  monal: "cd interop/clients && ./gradlew :monal:installDist -q"
